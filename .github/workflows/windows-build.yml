name: Windows Build & Test

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows x64 Build & Test
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake (Release)
        run: >
          cmake -B build -S .
          -G "Visual Studio 17 2022" -A x64
          -DCMAKE_BUILD_TYPE=Release
          -DCHORDSYNTH_BUILD_PLUGIN=ON
          -DBUILD_TESTING=ON

      - name: Build All Targets (Release)
        run: cmake --build build --config Release --parallel

      - name: Run CTest Suite
        run: ctest --test-dir build -C Release --output-on-failure --verbose

      - name: Archive Artifacts (Standalone & VST3)
        uses: actions/upload-artifact@v4
        with:
          name: chordsynth-windows-x64-release
          path: |
            build/ChordSynth_artefacts/Release/Standalone/ChordSynth.exe
            build/ChordSynth_artefacts/Release/Standalone/*.pdb
            build/ChordSynth_artefacts/Release/VST3/ChordSynth.vst3
          if-no-files-found: error
